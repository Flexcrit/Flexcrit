name: Generate Contribution Snake

on:
  schedule:
    # Run automatically every 24 hours at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Contribution Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: flexcrit
          outputs: |
            assets/snake-dark.svg?palette=github-dark&color_snake=#FFB000&color_dots=#1a1a1a,#2d2d14,#5c4800,#a88200,#FFB000

      - name: Push Snake SVG to Main Branch
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/snake-dark.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update contribution snake graph"
          git push
